name: SafShekan CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: safshekan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REMOTE_DIR: /opt/saf-shekan
  # Shared SSH hardening flags for every remote command (keeps each step
  # hermetic instead of relying only on the generated ~/.ssh/config).
  SSH_FLAGS: >-
    -o ConnectTimeout=20
    -o ServerAliveInterval=15
    -o ServerAliveCountMax=20
    -o TCPKeepAlive=yes
    -o StrictHostKeyChecking=accept-new

jobs:
  # ==========================================
  # STAGE 1: Quality Gate, Lint & Tests
  # ==========================================
  validate:
    name: Quality Gate (Build, Lint & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turbo Lint
        run: pnpm lint

      - name: Run Turbo Test Suite
        run: pnpm test

      - name: Run Turbo Monorepo Build
        run: pnpm build

  # ==========================================
  # STAGE 2A: Build & Push Backend Image
  # ==========================================
  build-backend:
    name: Docker Backend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # GitHub-hosted runners share Docker Hub IPs and receive HTTP 429.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/safshecan-backend"
          TAG="${{ github.sha }}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ==========================================
  # STAGE 2B: Build & Push Frontend Image
  # ==========================================
  build-frontend:
    name: Docker Frontend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # GitHub-hosted runners share Docker Hub IPs and receive HTTP 429.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/safshecan-frontend"
          TAG="${{ github.sha }}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
# ==========================================
  # STAGE 3A: Deployment Preflight
  # ==========================================
  preflight:
    name: Deployment Preflight
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      deploy_enabled: ${{ steps.check.outputs.deploy_enabled }}

    steps:
      - name: Detect deployment credentials
        id: check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_RUNS_ON: ${{ vars.DEPLOY_RUNS_ON }}
        run: |
          if [ -n "${SSH_PRIVATE_KEY}" ] || echo "${DEPLOY_RUNS_ON:-}" | grep -q 'self-hosted'; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            echo "Deployment credentials / self-hosted runner config detected."
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH_PRIVATE_KEY is not configured (and DEPLOY_RUNS_ON is not self-hosted). Skipping production deployment."
          fi

  # ==========================================
  # STAGE 3B: Production Deployment to Server
  # ==========================================
  deploy:
    name: Deploy to Production VPS
    needs: [build-backend, build-frontend, preflight]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.deploy_enabled == 'true'
    # Default: GitHub-hosted (SSH). For firewalled VPS set repo variable:
    #   DEPLOY_RUNS_ON = ["self-hosted","safshekan"]
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || '109.70.78.80' }}
      SSH_USER: ${{ secrets.SSH_USER || 'root' }}
      TLS_HOST: ${{ secrets.TLS_HOST || 'safshekan.rmhosseini.ir' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy mode
        id: mode
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "--> Deploy mode: LOCAL (self-hosted runner on the VPS)"
          else
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
            echo "--> Deploy mode: SSH from GitHub-hosted runner → ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          fi

      - name: Validate required secrets (SSH mode)
        if: steps.mode.outputs.mode == 'ssh'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST" || { echo "::error::Missing SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::Missing SSH_USER"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing secret SSH_PRIVATE_KEY"; exit 1; }
          P="${SSH_PORT:-22}"
          echo "SSH_FLAGS=-o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o StrictHostKeyChecking=accept-new -p ${P}" >> "$GITHUB_ENV"
          echo "--> SSH target: ${SSH_USER}@${SSH_HOST} port ${P}; TLS_HOST=${TLS_HOST}"

      - name: Setup SSH agent
        if: steps.mode.outputs.mode == 'ssh'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        if: steps.mode.outputs.mode == 'ssh'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -T 20 -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync compose + nginx (SSH)
        if: steps.mode.outputs.mode == 'ssh'
        run: |
          set -euo pipefail
          retry() {
            local attempt=1
            local max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Command failed after ${max} attempts: $*"
                return 1
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          # shellcheck disable=SC2086
          retry ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR/docker $REMOTE_DIR/data $REMOTE_DIR/docker/certs && chown -R 1001:1001 $REMOTE_DIR/data 2>/dev/null || true"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker-compose.yml"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS docker/nginx.conf "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker/nginx.conf"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS scripts/ci-deploy-on-host.sh "$SSH_USER@$SSH_HOST:$REMOTE_DIR/ci-deploy-on-host.sh"
          # shellcheck disable=SC2086
          retry ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "chmod +x $REMOTE_DIR/ci-deploy-on-host.sh; test -f $REMOTE_DIR/config.json || printf '{}\n' > $REMOTE_DIR/config.json"

      - name: Sync compose + nginx (local / self-hosted)
        if: steps.mode.outputs.mode == 'local'
        run: |
          set -euo pipefail
          # github-runner owns /opt/saf-shekan (chown once on VPS); sudo as fallback.
          install_tree() {
            mkdir -p "$REMOTE_DIR/docker" "$REMOTE_DIR/data" "$REMOTE_DIR/docker/certs"
            cp docker-compose.prod.yml "$REMOTE_DIR/docker-compose.yml"
            cp docker/nginx.conf "$REMOTE_DIR/docker/nginx.conf"
            cp scripts/ci-deploy-on-host.sh "$REMOTE_DIR/ci-deploy-on-host.sh"
            chmod +x "$REMOTE_DIR/ci-deploy-on-host.sh"
            test -f "$REMOTE_DIR/config.json" || printf '{}\n' > "$REMOTE_DIR/config.json"
            chown -R 1001:1001 "$REMOTE_DIR/data" 2>/dev/null || true
          }
          if ! install_tree 2>/dev/null; then
            echo "--> Falling back to sudo for $REMOTE_DIR..."
            sudo mkdir -p "$REMOTE_DIR/docker" "$REMOTE_DIR/data" "$REMOTE_DIR/docker/certs"
            sudo cp docker-compose.prod.yml "$REMOTE_DIR/docker-compose.yml"
            sudo cp docker/nginx.conf "$REMOTE_DIR/docker/nginx.conf"
            sudo cp scripts/ci-deploy-on-host.sh "$REMOTE_DIR/ci-deploy-on-host.sh"
            sudo chmod +x "$REMOTE_DIR/ci-deploy-on-host.sh"
            sudo bash -c "test -f $REMOTE_DIR/config.json || printf '{}\n' > $REMOTE_DIR/config.json"
            sudo chown -R github-runner:github-runner "$REMOTE_DIR"
            sudo chown -R 1001:1001 "$REMOTE_DIR/data" 2>/dev/null || true
          fi

      - name: Pull images & rolling restart on server
        env:
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.image_ref }}
          FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          DEPLOY_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_MODE" = "local" ]; then
            echo "--> Running host deploy script locally in $REMOTE_DIR"
            # Ensure docker socket access (github-runner is in docker group).
            BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
              GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" \
              REMOTE_DIR="$REMOTE_DIR" TLS_HOST="$TLS_HOST" \
              bash "$REMOTE_DIR/ci-deploy-on-host.sh"
          else
            run_remote_deploy() {
              # shellcheck disable=SC2086
              ssh $SSH_FLAGS \
                "$SSH_USER@$SSH_HOST" \
                BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
                GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" REMOTE_DIR="$REMOTE_DIR" \
                TLS_HOST="$TLS_HOST" \
                bash "$REMOTE_DIR/ci-deploy-on-host.sh"
            }
            attempt=1
            max=3
            until run_remote_deploy; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Remote rollout failed after ${max} attempts"
                exit 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          fi

      - name: Production Health Check Verification
        env:
          DEPLOY_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail

          check_containers() {
            set -euo pipefail
            missing=0
            for c in saf-shekan-backend saf-shekan-frontend saf-shekan-nginx; do
              if docker ps --format '{{.Names}}' | grep -qx "$c"; then
                echo "OK running: $c"
              else
                echo "::error::Missing running container: $c"
                missing=1
              fi
            done
            docker ps -a --filter name=saf-shekan --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}'
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi
          }

          echo "--> Confirming app containers exist on the VPS..."
          if [ "$DEPLOY_MODE" = "local" ]; then
            check_containers
          else
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          missing=0
          for c in saf-shekan-backend saf-shekan-frontend saf-shekan-nginx; do
            if docker ps --format '{{.Names}}' | grep -qx "$c"; then
              echo "OK running: $c"
            else
              echo "::error::Missing running container: $c"
              missing=1
            fi
          done
          docker ps -a --filter name=saf-shekan --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}'
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          REMOTE
          fi

          HEALTH_URLS=(
            "https://${TLS_HOST}/api/health"
            "https://127.0.0.1/api/health"
            "https://127.0.0.1:2032/api/health"
          )
          HOME_URLS=(
            "https://${TLS_HOST}/"
            "https://127.0.0.1/"
            "https://127.0.0.1:2032/"
          )
          echo "Verifying stack (domain ${TLS_HOST} or local nginx / :2032)..."
          # Avoid flaky TLS EOF (curl 56) through Cloudflare / HTTP2 — never fail deploy on debug body fetch.
          CURL_VERIFY=(
            curl -ksS
            --http1.1
            --connect-timeout 10
            --max-time 25
            --retry 2
            --retry-delay 1
            --retry-all-errors
          )
          STACK_UP=false
          for i in $(seq 1 40); do
            for idx in 0 1 2; do
              h="${HEALTH_URLS[$idx]}"
              p="${HOME_URLS[$idx]}"
              if "${CURL_VERIFY[@]}" -f -o /dev/null "$h" \
                && "${CURL_VERIFY[@]}" -f -o /dev/null "$p"; then
                STACK_UP=true
                echo "Healthy via $h (attempt $i)"
                "${CURL_VERIFY[@]}" "$h" | head -c 4096 || true
                echo ""
                break 2
              fi
            done
            echo "Waiting for health... ($i/40)"
            sleep 3
          done

          if [ "$STACK_UP" = false ]; then
            echo "::error::Deployment health check failed for ${TLS_HOST} (and local :443 / :2032)"
            if [ "$DEPLOY_MODE" = "local" ]; then
              docker ps -a --filter name=saf-shekan || true
              docker logs saf-shekan-frontend --tail 60 || true
              docker logs saf-shekan-backend --tail 60 || true
            else
              # shellcheck disable=SC2086
              ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker ps -a --filter name=saf-shekan" || true
            fi
            exit 1
          fi

          probe_http_code() {
            local url
            for url in "$@"; do
              code=$("${CURL_VERIFY[@]}" -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || true)
              if [ -n "$code" ] && [ "$code" != "000" ]; then
                echo "$code"
                return 0
              fi
            done
            echo "000"
          }

          LOGIN_CODE=$(probe_http_code \
            "https://${TLS_HOST}/login" \
            "https://127.0.0.1:2032/login")
          AUTH_CODE=$(probe_http_code \
            "https://${TLS_HOST}/api/auth/me" \
            "https://127.0.0.1:2032/api/auth/me")
          echo "Post-deploy probe: /login=${LOGIN_CODE} /api/auth/me=${AUTH_CODE}"
          if [ "$LOGIN_CODE" != "200" ] && [ "$LOGIN_CODE" != "307" ] && [ "$LOGIN_CODE" != "308" ]; then
            echo "::warning::/login returned ${LOGIN_CODE} (expected 200/307)"
          fi
          if [ "$AUTH_CODE" = "404" ]; then
            echo "::error::/api/auth/me returned 404 — backend may be stale"
            exit 1
          fi

          echo "All services deployed and verified successfully!"

      - name: Publish Deployment Summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## SafShekan Production Deployment Report

          | Component | Status | URL |
          |---|---|---|
          | **Gateway** | Live | [https://${{ env.TLS_HOST }}](https://${{ env.TLS_HOST }}) |
          | **Health Check** | Healthy | [https://${{ env.TLS_HOST }}/api/health](https://${{ env.TLS_HOST }}/api/health) |
          | **Swagger** | Ready | [https://${{ env.TLS_HOST }}/api/docs](https://${{ env.TLS_HOST }}/api/docs) |

          - **Git SHA**: \`${{ github.sha }}\`
          - **Triggered By**: @${{ github.actor }}
          - **Target VPS**: \`${{ env.SSH_USER }}@${{ env.SSH_HOST }}\` — **public URL**: \`${{ env.TLS_HOST }}\` (\`/opt/saf-shekan\`)
          - **Docker gateway**: \`:2032\` → backend \`/api\`+\`/ws\`, frontend \`/\`
          - **Direct ports**: backend \`:2030\`, frontend \`:2031\`
          - **Backend Image**: \`${{ needs.build-backend.outputs.image_ref }}\`
          - **Frontend Image**: \`${{ needs.build-frontend.outputs.image_ref }}\`
          EOF
