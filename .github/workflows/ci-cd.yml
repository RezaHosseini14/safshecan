name: SafShekan CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: safshekan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REMOTE_DIR: /opt/saf-shekan
  # Shared SSH hardening flags for every remote command (keeps each step
  # hermetic instead of relying only on the generated ~/.ssh/config).
  SSH_FLAGS: >-
    -o ConnectTimeout=20
    -o ServerAliveInterval=15
    -o ServerAliveCountMax=20
    -o TCPKeepAlive=yes
    -o StrictHostKeyChecking=accept-new

jobs:
  # ==========================================
  # STAGE 1: Quality Gate, Lint & Tests
  # ==========================================
  validate:
    name: Quality Gate (Build, Lint & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turbo Lint
        run: pnpm lint

      - name: Run Turbo Test Suite
        run: pnpm test

      - name: Run Turbo Monorepo Build
        run: pnpm build

  # ==========================================
  # STAGE 2A: Build & Push Backend Image
  # ==========================================
  build-backend:
    name: Docker Backend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # GitHub-hosted runners share Docker Hub IPs and receive HTTP 429.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/safshecan-backend"
          TAG="${{ github.sha }}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ==========================================
  # STAGE 2B: Build & Push Frontend Image
  # ==========================================
  build-frontend:
    name: Docker Frontend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # GitHub-hosted runners share Docker Hub IPs and receive HTTP 429.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/safshecan-frontend"
          TAG="${{ github.sha }}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ==========================================
  # STAGE 3A: Deployment Preflight
  # ==========================================
  # A missing deploy secret must never turn the pipeline red. When no SSH key
  # is configured the deployment is skipped with a warning instead of failing.
  preflight:
    name: Deployment Preflight
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      deploy_enabled: ${{ steps.check.outputs.deploy_enabled }}

    steps:
      - name: Detect deployment credentials
        id: check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "${SSH_PRIVATE_KEY}" ]; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            echo "Deployment credentials detected."
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH_PRIVATE_KEY is not configured. Skipping production deployment."
          fi

  # ==========================================
  # STAGE 3B: Production Deployment to Server
  # ==========================================
  deploy:
    name: Deploy to Production VPS
    needs: [build-backend, build-frontend, preflight]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.deploy_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || '5.159.49.36' }}
      SSH_USER: ${{ secrets.SSH_USER || 'root' }}
      TLS_HOST: ${{ secrets.SSH_HOST || '5.159.49.36' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST" || { echo "::error::Missing SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::Missing SSH_USER"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing secret SSH_PRIVATE_KEY"; exit 1; }

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat <<'EOF' > ~/.ssh/config
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 20
            TCPKeepAlive yes
            ConnectTimeout 30
            StrictHostKeyChecking accept-new
          EOF
          ssh-keyscan -H -T 20 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "WARN: ssh-keyscan failed; host key will be verified via accept-new"
          }
          chmod 600 ~/.ssh/known_hosts ~/.ssh/config 2>/dev/null || true

      - name: Sync compose + nginx config to server
        run: |
          set -euo pipefail

          # Transient SSH/SCP drops are the single most common cause of a red
          # deploy run, so every connection gets a bounded retry.
          retry() {
            local attempt=1
            local max=5
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Command failed after ${max} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt} failed. Retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          # shellcheck disable=SC2086
          retry ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR/docker $REMOTE_DIR/data && chown -R 1001:1001 $REMOTE_DIR/data 2>/dev/null || true"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker-compose.yml"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS docker/nginx.conf "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker/nginx.conf"
          # Ensure persistent config.json exists (never overwrite an existing one)
          # shellcheck disable=SC2086
          retry ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "test -f $REMOTE_DIR/config.json || printf '{}\n' > $REMOTE_DIR/config.json"

      - name: Pull images & rolling restart on server
        env:
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.image_ref }}
          FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail

          # The rollout is idempotent, so retrying the whole remote script is safe
          # when the long-lived SSH session drops mid-way.
          run_remote_deploy() {
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS \
              "$SSH_USER@$SSH_HOST" \
              BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
              GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" REMOTE_DIR="$REMOTE_DIR" \
              TLS_HOST="$TLS_HOST" \
              bash -s <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"
          # Never pick up a stale COMPOSE_FILE from the server environment.
          unset COMPOSE_FILE COMPOSE_PATH || true
          export COMPOSE_PROJECT_NAME=saf-shekan

          echo "--> Deploy host: $(hostname) pwd=$(pwd)"
          echo "--> Compose ports (must include 4030/4031):"
          grep -nE 'ports:|4030|4031|3000:443' docker-compose.yml || true

          if [ -n "${GHCR_TOKEN}" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi

          touch .env
          if grep -q '^BACKEND_IMAGE=' .env; then
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env
          else
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> .env
          fi

          if grep -q '^FRONTEND_IMAGE=' .env; then
            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${FRONTEND_IMAGE}|" .env
          else
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> .env
          fi

          if [ -z "${BACKEND_IMAGE}" ] || [ -z "${FRONTEND_IMAGE}" ]; then
            echo "::error::Build jobs did not pass backend/frontend image refs"
            exit 1
          fi
          echo "--> Target images: backend=${BACKEND_IMAGE} frontend=${FRONTEND_IMAGE}"
          echo "--> .env image pins:"
          grep -E '^(BACKEND_IMAGE|FRONTEND_IMAGE)=' .env

          # Ensure production database, cache, and encryption secrets exist in .env
          if ! grep -q '^POSTGRES_PASSWORD=' .env; then
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
          fi
          if ! grep -q '^REDIS_PASSWORD=' .env; then
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)" >> .env
          fi
          if ! grep -q '^ENCRYPTION_MASTER_KEY=' .env; then
            echo "ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)" >> .env
          fi
          if ! grep -q '^JWT_ACCESS_SECRET=' .env; then
            echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)" >> .env
          fi
          if ! grep -q '^JWT_REFRESH_SECRET=' .env; then
            echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48)" >> .env
          fi

          # Remove legacy env keys if present
          sed -i '/^API_IMAGE=/d;/^WEB_IMAGE=/d' .env || true

          # Legacy container names only — never delete the live app tier before
          # the replacement is confirmed up (that previously left prod dark).
          docker rm -f saf-shekan-api saf-shekan-web 2>/dev/null || true

          mkdir -p docker/certs
          if [ ! -s docker/certs/server.crt ] || [ ! -s docker/certs/server.key ]; then
            echo "--> Creating the self-signed TLS certificate on the host..."
            openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
              -keyout docker/certs/server.key \
              -out docker/certs/server.crt \
              -subj "/CN=${TLS_HOST:-5.159.49.36}" \
              -addext "subjectAltName=IP:${TLS_HOST:-5.159.49.36}"
          fi

          echo "--> Pulling latest container images..."
          pulled=0
          for attempt in 1 2 3 4 5; do
            if docker compose -f docker-compose.yml pull backend frontend; then
              pulled=1
              break
            fi
            echo "compose pull failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 4))
          done
          if [ "$pulled" != 1 ]; then
            echo "::error::docker compose pull failed after 5 attempts"
            exit 1
          fi

          echo "--> Starting Postgres and Redis data layer..."
          if ! docker compose -f docker-compose.yml up -d postgres redis --wait --wait-timeout 60; then
            echo "::error::Postgres or Redis failed to become healthy within 60s"
            docker compose -f docker-compose.yml ps || true
            docker logs saf-shekan-postgres --tail 50 || true
            docker logs saf-shekan-redis --tail 50 || true
            exit 1
          fi

          echo "--> Executing database migrations..."
          if ! docker compose -f docker-compose.yml run --rm --no-deps backend \
            node apps/backend/dist/infrastructure/database/migrate.js; then
            echo "::error::Database migrations failed! Halting deployment to protect uptime."
            exit 1
          fi

          recreate_app() {
            docker compose -f docker-compose.yml up -d --pull missing --force-recreate \
              --wait --wait-timeout 300 backend frontend nginx
          }

          echo "--> Recreating backend + frontend + nginx (DB left running)..."
          if ! recreate_app; then
            echo "--> Recreate failed (often a stale container_name). Replacing app containers once..."
            docker rm -f saf-shekan-backend saf-shekan-frontend saf-shekan-nginx 2>/dev/null || true
            if ! recreate_app; then
              echo "::error::docker compose up failed for backend/frontend/nginx"
              docker compose -f docker-compose.yml ps || true
              docker logs saf-shekan-backend --tail 100 || true
              docker logs saf-shekan-frontend --tail 100 || true
              docker logs saf-shekan-nginx --tail 100 || true
              exit 1
            fi
          fi

          echo "--> Verifying the running containers use the freshly built images..."
          EXPECTED_BACKEND_ID=$(docker image inspect --format '{{.Id}}' "$BACKEND_IMAGE" 2>/dev/null || echo '')
          EXPECTED_FRONTEND_ID=$(docker image inspect --format '{{.Id}}' "$FRONTEND_IMAGE" 2>/dev/null || echo '')
          RUNNING_BACKEND_ID=$(docker inspect --format '{{.Image}}' saf-shekan-backend 2>/dev/null || echo '')
          RUNNING_FRONTEND_ID=$(docker inspect --format '{{.Image}}' saf-shekan-frontend 2>/dev/null || echo '')
          RUNNING_BACKEND_REF=$(docker inspect --format '{{.Config.Image}}' saf-shekan-backend 2>/dev/null || echo '')
          RUNNING_FRONTEND_REF=$(docker inspect --format '{{.Config.Image}}' saf-shekan-frontend 2>/dev/null || echo '')
          echo "    backend:  running=${RUNNING_BACKEND_ID} ref=${RUNNING_BACKEND_REF} expected=${EXPECTED_BACKEND_ID} (${BACKEND_IMAGE})"
          echo "    frontend: running=${RUNNING_FRONTEND_ID} ref=${RUNNING_FRONTEND_REF} expected=${EXPECTED_FRONTEND_ID} (${FRONTEND_IMAGE})"
          if [ -z "$RUNNING_BACKEND_ID" ] || [ "$RUNNING_BACKEND_ID" != "$EXPECTED_BACKEND_ID" ] \
            || [ -z "$RUNNING_FRONTEND_ID" ] || [ "$RUNNING_FRONTEND_ID" != "$EXPECTED_FRONTEND_ID" ]; then
            echo "::error::Running containers are not on the built images; the deployment did not take effect"
            docker ps --filter name=saf-shekan || true
            exit 1
          fi

          echo "--> Verifying published host ports (backend:4030 frontend:4031 nginx:3000)..."
          docker ps --filter name=saf-shekan --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          BACKEND_PORTS=$(docker port saf-shekan-backend 3000/tcp 2>/dev/null || true)
          FRONTEND_PORTS=$(docker port saf-shekan-frontend 3000/tcp 2>/dev/null || true)
          NGINX_PORTS=$(docker port saf-shekan-nginx 443/tcp 2>/dev/null || true)
          echo "    backend 3000/tcp -> ${BACKEND_PORTS}"
          echo "    frontend 3000/tcp -> ${FRONTEND_PORTS}"
          echo "    nginx 443/tcp -> ${NGINX_PORTS}"
          echo "$BACKEND_PORTS" | grep -qE '(:|::)4030$' || {
            echo "::error::backend is not published on host port 4030 (got: ${BACKEND_PORTS})"
            exit 1
          }
          echo "$FRONTEND_PORTS" | grep -qE '(:|::)4031$' || {
            echo "::error::frontend is not published on host port 4031 (got: ${FRONTEND_PORTS})"
            exit 1
          }
          echo "$NGINX_PORTS" | grep -qE '(:|::)3000$' || {
            echo "::error::nginx is not published on host port 3000 (got: ${NGINX_PORTS})"
            exit 1
          }

          echo "--> Local health probe via nginx on the VPS..."
          if ! docker exec saf-shekan-nginx wget -qO- http://127.0.0.1/api/health; then
            echo "::error::nginx local /api/health failed after recreate"
            docker logs saf-shekan-backend --tail 80 || true
            docker logs saf-shekan-frontend --tail 80 || true
            docker logs saf-shekan-nginx --tail 80 || true
            exit 1
          fi
          echo ""

          echo "--> Reloading nginx so the mounted config is applied..."
          reloaded=0
          for attempt in $(seq 1 20); do
            if docker exec saf-shekan-nginx nginx -s reload; then
              reloaded=1
              break
            fi
            sleep 2
          done
          if [ "$reloaded" != 1 ]; then
            echo "::error::nginx did not accept reload"
            docker logs saf-shekan-nginx --tail 80 || true
            exit 1
          fi

          echo "--> Cleaning up unused dangling images..."
          docker image prune -f || true
          EOF
          }

          attempt=1
          max=3
          until run_remote_deploy; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::Remote rollout failed after ${max} attempts"
              exit 1
            fi
            echo "Remote rollout attempt ${attempt} failed. Retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done

      - name: Production Health Check Verification
        run: |
          set -uo pipefail

          echo "--> Confirming app containers exist on the VPS..."
          # shellcheck disable=SC2086
          ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" \
            "docker inspect --format '{{.Name}} {{.State.Status}} {{.Config.Image}}' \
              saf-shekan-backend saf-shekan-frontend saf-shekan-nginx \
            && docker ps --filter name=saf-shekan --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"

          echo "Verifying stack at https://${SSH_HOST}:3000 (nginx → frontend + /api/health)..."
          STACK_UP=false
          for i in $(seq 1 40); do
            if curl -kfsS --connect-timeout 5 "https://${SSH_HOST}:3000/api/health" >/dev/null \
              && curl -kfsS --connect-timeout 5 "https://${SSH_HOST}:3000" >/dev/null; then
              STACK_UP=true
              echo "Frontend + Backend (via nginx) healthy on attempt $i"
              curl -kfsS "https://${SSH_HOST}:3000/api/health"
              echo ""
              break
            fi
            echo "Waiting for :3000... ($i/40)"
            sleep 3
          done

          if [ "$STACK_UP" = false ]; then
            echo "::error::Deployment health check failed"
            echo "=== Container status (via SSH, best effort) ==="
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker ps -a --filter name=saf-shekan" || true
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker logs saf-shekan-frontend --tail 60" || true
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker logs saf-shekan-backend --tail 60" || true
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker logs saf-shekan-nginx --tail 60" || true
            exit 1
          fi

          # The login route and the auth API only exist in this build, so they
          # prove the new images are serving traffic (a stale stack returns 404).
          LOGIN_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "https://${SSH_HOST}:3000/login" || echo "000")
          AUTH_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "https://${SSH_HOST}:3000/api/auth/me" || echo "000")
          echo "Post-deploy probe: /login=${LOGIN_CODE} /api/auth/me=${AUTH_CODE}"
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "::error::/login returned ${LOGIN_CODE} (expected 200) — the frontend is still serving an old image"
            exit 1
          fi
          if [ "$AUTH_CODE" = "404" ]; then
            echo "::error::/api/auth/me returned 404 — the backend is still serving an old image"
            exit 1
          fi

          echo "All services deployed and verified successfully!"

      - name: Publish Deployment Summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## SafShekan Production Deployment Report

          | Component | Status | URL |
          |---|---|---|
          | **Frontend Dashboard** | Live | [https://${{ env.SSH_HOST }}:3000](https://${{ env.SSH_HOST }}:3000) |
          | **Backend Engine** | Live | [https://${{ env.SSH_HOST }}:3000/api/status](https://${{ env.SSH_HOST }}:3000/api/status) |
          | **Swagger Docs** | Ready | [https://${{ env.SSH_HOST }}:3000/api/docs](https://${{ env.SSH_HOST }}:3000/api/docs) |
          | **Health Check** | Healthy | [https://${{ env.SSH_HOST }}:3000/api/health](https://${{ env.SSH_HOST }}:3000/api/health) |

          - **Git SHA**: \`${{ github.sha }}\`
          - **Triggered By**: @${{ github.actor }}
          - **Target VPS**: \`${{ env.SSH_HOST }}\` (\`/opt/saf-shekan\`)
          - **Gateway**: nginx on \`:3000\` → backend \`/api\`+\`/ws\`, frontend \`/\`
          - **Direct ports**: backend \`:4030\`, frontend \`:4031\`
          - **Backend Image**: \`${{ needs.build-backend.outputs.image_ref }}\`
          - **Frontend Image**: \`${{ needs.build-frontend.outputs.image_ref }}\`
          EOF
