name: SafShekan CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded pull request runs. Leave pushes alone so a production
# deploy is not killed halfway through.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  REGISTRY: ghcr.io
  REMOTE_DIR: /opt/saf-shekan

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Test SSH target sanitizer
        run: bash scripts/sanitize-ssh-target.sh --test

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Build
        run: pnpm build

  build-api:
    name: Build and push API image
    needs: [lint, typecheck, test, build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER}/safshecan-api"
          TAG="${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build and push web image
    needs: [lint, typecheck, test, build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER}/safshecan-web"
          TAG="${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to production
    needs: [lint, typecheck, test, build, build-api, build-web]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required deploy secrets
        id: gate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SSH_HOST}" ] && missing+=(SSH_HOST)
          [ -z "${SSH_USER}" ] && missing+=(SSH_USER)
          [ -z "${SSH_PRIVATE_KEY}" ] && missing+=(SSH_PRIVATE_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy skipped. Add these Actions secrets: ${missing[*]}"
            {
              echo "## Deploy skipped"
              echo ""
              echo "Production deploy did not run because these repository secrets are missing:"
              echo ""
              for name in "${missing[@]}"; do
                echo "- \`$name\`"
              done
              echo ""
              echo "Add them under Settings → Secrets and variables → Actions:"
              echo "- \`SSH_HOST\`: server hostname or IP, one line"
              echo "- \`SSH_USER\`: SSH login, one line (for example \`root\`)"
              echo "- \`SSH_PRIVATE_KEY\`: private key whose public half is in the server authorized_keys"
              echo ""
              echo "Optional:"
              echo "- \`SSH_KNOWN_HOSTS\`: output of \`ssh-keyscan -H <host>\`. Without it, the job records the current host key on each deploy."
              echo "- \`GHCR_PULL_TOKEN\`: package read token. Without it, the job uses \`GITHUB_TOKEN\` to pull the images."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        id: ssh
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          parsed="$(bash scripts/sanitize-ssh-target.sh)"
          host="$(printf '%s\n' "$parsed" | sed -n 's/^host=//p')"
          user="$(printf '%s\n' "$parsed" | sed -n 's/^user=//p')"
          if [ -z "$host" ] || [ -z "$user" ]; then
            echo "ERROR: Could not read a sanitized SSH host and user."
            exit 1
          fi

          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          if ! ssh-keygen -l -f "$HOME/.ssh/id_deploy" >/dev/null; then
            echo "ERROR: SSH_PRIVATE_KEY is not a valid private key."
            exit 1
          fi

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          else
            echo "SSH_KNOWN_HOSTS is unset. Recording the current host key with ssh-keyscan."
            echo "Add an SSH_KNOWN_HOSTS secret (ssh-keyscan -H <host>) so a changed host key fails closed."
            ssh-keyscan -T 15 -H "$host" > "$HOME/.ssh/known_hosts"
          fi
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "ERROR: No SSH host key is available for the deploy server."
            echo "Set SSH_KNOWN_HOSTS to the output of: ssh-keyscan -H <host>"
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          cat > "$HOME/.ssh/config" <<EOF
          Host deploy
            HostName ${host}
            User ${user}
            IdentityFile ${HOME}/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ${HOME}/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF
          chmod 600 "$HOME/.ssh/config"

          {
            echo "host=${host}"
            echo "user=${user}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload compose file
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ssh deploy "mkdir -p '${REMOTE_DIR}'"
          scp docker-compose.prod.yml "deploy:${REMOTE_DIR}/docker-compose.yml"

      - name: Pull images and restart
        if: steps.gate.outputs.skip != 'true'
        env:
          API_IMAGE: ${{ needs.build-api.outputs.image_ref }}
          WEB_IMAGE: ${{ needs.build-web.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote_env="$(printf 'API_IMAGE=%q WEB_IMAGE=%q GHCR_USER=%q GHCR_TOKEN=%q REMOTE_DIR=%q' \
            "$API_IMAGE" "$WEB_IMAGE" "$GHCR_USER" "$GHCR_TOKEN" "$REMOTE_DIR")"
          ssh deploy "${remote_env} bash -s" <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"
          if [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi
          touch .env
          tmp="$(mktemp)"
          grep -v -e '^API_IMAGE=' -e '^WEB_IMAGE=' .env > "$tmp" || true
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" >> "$tmp"
          mv "$tmp" .env
          echo "Pulling images..."
          docker compose pull
          echo "Restarting services..."
          docker compose up -d --remove-orphans
          docker image prune -f || true
          EOF

      - name: Check health on the server
        id: server_health
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ssh deploy "REMOTE_DIR='${REMOTE_DIR}' bash -s" <<'EOF'
          set -euo pipefail
          probe() {
            url="$1"
            name="$2"
            i=1
            while [ "$i" -le 30 ]; do
              if command -v curl >/dev/null 2>&1; then
                if curl -sf --connect-timeout 5 "$url" >/dev/null; then
                  echo "$name is healthy on the server (attempt $i)"
                  return 0
                fi
              elif command -v wget >/dev/null 2>&1; then
                if wget -qO- --timeout=5 "$url" >/dev/null; then
                  echo "$name is healthy on the server (attempt $i)"
                  return 0
                fi
              else
                echo "ERROR: the server has neither curl nor wget, so the health check cannot run."
                return 1
              fi
              echo "Waiting for $name on the server ($i/30)"
              i=$((i + 1))
              sleep 3
            done
            echo "ERROR: $name did not become healthy at $url"
            docker compose -f "${REMOTE_DIR}/docker-compose.yml" ps || true
            return 1
          }
          probe "http://127.0.0.1:3880/api/health" "API"
          probe "http://127.0.0.1:3000" "Web"
          EOF

      - name: Check public health
        id: public_health
        if: steps.gate.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ steps.ssh.outputs.host }}
        run: |
          set -euo pipefail
          probe() {
            url="$1"
            name="$2"
            i=1
            while [ "$i" -le 20 ]; do
              if curl -sf --connect-timeout 5 "$url" >/dev/null; then
                echo "$name is reachable (attempt $i): $url"
                return 0
              fi
              echo "Waiting for $name ($i/20)"
              i=$((i + 1))
              sleep 3
            done
            echo "ERROR: $name is not reachable from GitHub Actions at $url"
            echo "The service can still be healthy on the server. Open inbound TCP for this port if it should be public."
            return 1
          }
          probe "http://${SSH_HOST}:3880/api/health" "Public API"
          probe "http://${SSH_HOST}:3000" "Public web"

      - name: Publish deployment summary
        if: always() && steps.gate.outputs.skip == 'false'
        env:
          SERVER_HEALTH: ${{ steps.server_health.outcome }}
          PUBLIC_HEALTH: ${{ steps.public_health.outcome }}
          API_IMAGE: ${{ needs.build-api.outputs.image_ref }}
          WEB_IMAGE: ${{ needs.build-web.outputs.image_ref }}
          SSH_HOST: ${{ steps.ssh.outputs.host }}
        run: |
          set -euo pipefail
          if [ "$SERVER_HEALTH" = "success" ] && [ "$PUBLIC_HEALTH" = "success" ]; then
            state="Deployed"
          else
            state="Failed"
          fi
          {
            echo "## Production deploy: ${state}"
            echo ""
            echo "- Git SHA: \`${{ github.sha }}\`"
            echo "- Triggered by: @${{ github.actor }}"
            echo "- API image: \`${API_IMAGE}\`"
            echo "- Web image: \`${WEB_IMAGE}\`"
            echo "- Server health check: ${SERVER_HEALTH}"
            echo "- Public health check: ${PUBLIC_HEALTH}"
            if [ -n "${SSH_HOST}" ]; then
              echo "- Web: http://${SSH_HOST}:3000"
              echo "- API health: http://${SSH_HOST}:3880/api/health"
              echo "- API docs: http://${SSH_HOST}:3880/api/docs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
