name: SafShekan CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: safshekan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REMOTE_DIR: /opt/saf-shekan

jobs:
  # ==========================================
  # STAGE 1: Quality Gate, Lint & Tests
  # ==========================================
  validate:
    name: Quality Gate (Build, Lint & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turbo Lint
        run: pnpm lint

      - name: Run Turbo Test Suite
        run: pnpm test

      - name: Run Turbo Monorepo Build
        run: pnpm build

  # ==========================================
  # STAGE 2A: Build & Push Backend Image
  # ==========================================
  build-backend:
    name: Docker Backend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # GitHub-hosted runners share Docker Hub IPs and receive HTTP 429.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/safshecan-backend"
          TAG="${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ==========================================
  # STAGE 2B: Build & Push Frontend Image
  # ==========================================
  build-frontend:
    name: Docker Frontend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # GitHub-hosted runners share Docker Hub IPs and receive HTTP 429.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/safshecan-frontend"
          TAG="${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ==========================================
  # STAGE 3: Production Deployment to Server
  # ==========================================
  deploy:
    name: Deploy to Production VPS
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || '5.159.49.36' }}
      SSH_USER: ${{ secrets.SSH_USER || 'root' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST" || { echo "::error::Missing SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::Missing SSH_USER"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing secret SSH_PRIVATE_KEY"; exit 1; }

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -T 20 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "WARN: ssh-keyscan failed; allowing first connect with StrictHostKeyChecking=accept-new"
            echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config
          }
          chmod 600 ~/.ssh/known_hosts ~/.ssh/config 2>/dev/null || true

      - name: Sync compose + nginx config to server
        run: |
          ssh -o ConnectTimeout=30 "$SSH_USER@$SSH_HOST" "mkdir -p ${{ env.REMOTE_DIR }}/docker"
          scp docker-compose.prod.yml "$SSH_USER@$SSH_HOST:${{ env.REMOTE_DIR }}/docker-compose.yml"
          scp docker/nginx.conf "$SSH_USER@$SSH_HOST:${{ env.REMOTE_DIR }}/docker/nginx.conf"
          # Ensure persistent config.json exists (do not overwrite if present)
          ssh "$SSH_USER@$SSH_HOST" "test -f ${{ env.REMOTE_DIR }}/config.json || echo '{}' > ${{ env.REMOTE_DIR }}/config.json"

      - name: Pull images & rolling restart on server
        env:
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.image_ref }}
          FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
            GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" REMOTE_DIR="${{ env.REMOTE_DIR }}" \
            bash -s <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"

          if [ -n "${GHCR_TOKEN}" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi

          touch .env
          if grep -q '^BACKEND_IMAGE=' .env; then
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env
          else
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> .env
          fi

          if grep -q '^FRONTEND_IMAGE=' .env; then
            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${FRONTEND_IMAGE}|" .env
          else
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> .env
          fi

          # Remove legacy env keys if present
          sed -i '/^API_IMAGE=/d;/^WEB_IMAGE=/d' .env || true

          # Stop legacy published ports if still running (api:3880 / old frontend:3000)
          docker rm -f saf-shekan-api saf-shekan-web 2>/dev/null || true

          mkdir -p docker/certs
          if [ ! -s docker/certs/server.crt ] || [ ! -s docker/certs/server.key ]; then
            echo "--> Creating the self-signed TLS certificate on the host..."
            openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
              -keyout docker/certs/server.key \
              -out docker/certs/server.crt \
              -subj "/CN=${TLS_HOST:-5.159.49.36}" \
              -addext "subjectAltName=IP:${TLS_HOST:-5.159.49.36}"
          fi

          echo "--> Pulling latest container images..."
          pulled=0
          for attempt in 1 2 3 4 5; do
            if docker compose pull; then
              pulled=1
              break
            fi
            echo "compose pull failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 4))
          done
          if [ "$pulled" != 1 ]; then
            echo "::error::docker compose pull failed after 5 attempts"
            exit 1
          fi

          echo "--> Applying rolling update (nginx + backend + frontend)..."
          if ! docker compose up -d --remove-orphans --wait --wait-timeout 180; then
            echo "::error::docker compose up failed"
            docker compose ps || true
            docker logs saf-shekan-nginx --tail 80 || true
            exit 1
          fi

          # compose up does not reload an already-running nginx when only the
          # mounted config changed. Wait until the master process exists; a
          # reload during apk/openssl startup used to fail this step in ~8s.
          echo "--> Reloading nginx so the mounted config is applied..."
          reloaded=0
          for attempt in $(seq 1 20); do
            if docker exec saf-shekan-nginx nginx -s reload; then
              reloaded=1
              break
            fi
            sleep 2
          done
          if [ "$reloaded" != 1 ]; then
            echo "::error::nginx did not accept reload"
            docker logs saf-shekan-nginx --tail 80 || true
            exit 1
          fi

          echo "--> Cleaning up unused dangling images..."
          docker image prune -f || true
          EOF

      - name: Production Health Check Verification
        run: |
          echo "Verifying stack at https://${SSH_HOST}:3000 (nginx → frontend + /api/health)..."
          STACK_UP=false
          for i in $(seq 1 40); do
            if curl -kfsS --connect-timeout 5 "https://${SSH_HOST}:3000/api/health" >/dev/null \
              && curl -kfsS --connect-timeout 5 "https://${SSH_HOST}:3000" >/dev/null; then
              STACK_UP=true
              echo "Frontend + Backend (via nginx) healthy on attempt $i"
              curl -kfsS "https://${SSH_HOST}:3000/api/health"
              echo ""
              break
            fi
            echo "Waiting for :3000... ($i/40)"
            sleep 3
          done

          if [ "$STACK_UP" = false ]; then
            echo "Deployment Health Check Failed!"
            exit 1
          fi

          echo "All services deployed and verified successfully!"

      - name: Publish Deployment Summary
        if: always()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## SafShekan Production Deployment Report

          | Component | Status | URL |
          |---|---|---|
          | **Frontend Dashboard** | Live | [https://${{ env.SSH_HOST }}:3000](https://${{ env.SSH_HOST }}:3000) |
          | **Backend Engine** | Live | [https://${{ env.SSH_HOST }}:3000/api/status](https://${{ env.SSH_HOST }}:3000/api/status) |
          | **Swagger Docs** | Ready | [https://${{ env.SSH_HOST }}:3000/api/docs](https://${{ env.SSH_HOST }}:3000/api/docs) |
          | **Health Check** | Healthy | [https://${{ env.SSH_HOST }}:3000/api/health](https://${{ env.SSH_HOST }}:3000/api/health) |

          - **Git SHA**: \`${{ github.sha }}\`
          - **Triggered By**: @${{ github.actor }}
          - **Target VPS**: \`${{ env.SSH_HOST }}\` (\`/opt/saf-shekan\`)
          - **Gateway**: nginx on \`:3000\` → backend \`/api\`+\`/ws\`, frontend \`/\`
          - **Backend Image**: \`${{ needs.build-backend.outputs.image_ref }}\`
          - **Frontend Image**: \`${{ needs.build-frontend.outputs.image_ref }}\`
          EOF
